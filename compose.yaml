# Local execution layer: Postgres, and one container holding both Rails and the
# MetaTrader terminals it starts.
#
#   docker compose build
#   docker compose run --rm app bin/rails db:prepare
#   docker compose run --rm -e MT5_VNC=1 app docker/mt5-worker/prepare-template.sh
#   docker compose up
#
# See doc/EXECUTION_ARCHITECTURE.md §9.7.
name: goldgrid

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: goldgrid
      POSTGRES_PASSWORD: goldgrid
      POSTGRES_DB: gold_grid_development
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goldgrid -d gold_grid_development"]
      interval: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/mt5-worker/Dockerfile
    # Brings the container back after an unexpected exit or a Docker Desktop
    # restart. Not after `docker compose stop`, so a deliberate stop stays stopped.
    restart: unless-stopped
    # A real init as PID 1, so terminals whose parent has exited are reaped
    # instead of lingering as zombies. Puma, left as PID 1, never reaps them.
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_USERNAME: goldgrid
      DATABASE_PASSWORD: goldgrid

      # The switch that turns the execution layer on. Without it the runtime is
      # `simulated` and nothing real is ever started — deliberate, so a
      # half-configured box fails loudly rather than spawning terminals against
      # a broker.
      MT5_RUNTIME: local
      MT5_INSTANCES_ROOT: /opt/goldgrid/instances
      MT5_TEMPLATE_DIR: /opt/mt5/drive_c/Program Files/MetaTrader 5
      MT5_TERMINAL_BINARY: /opt/mt5/drive_c/Program Files/MetaTrader 5/terminal64.exe
      MT5_WINE_BINARY: /usr/bin/wine
      MT5_XVFB_BINARY: /usr/bin/Xvfb
      MT5_DISPLAY_BASE: "100"
      MT5_MAX_INSTANCES: "4"
      MT5_NODE_NAME: docker-local

      # Run the Solid Queue supervisor inside Puma (config/puma.rb picks this
      # up). One container is a hard constraint of the Local runtime, so the
      # job runner cannot be its own service — and without it the recurring
      # jobs in config/recurring.yml never run, the node's heartbeat goes
      # stale, and Start fails with no_capacity two minutes after boot.
      SOLID_QUEUE_IN_PUMA: "1"

      # Rebuild the Tailwind stylesheet as files change (config/puma.rb picks
      # this up). The source is mounted, but the compiled CSS is not rebuilt by
      # anything else in this container.
      TAILWINDCSS_IN_PUMA: "1"

      # Written into every terminal's EA config. The EA calls the platform from
      # inside this same container, so loopback is correct — and it is what the
      # template's WebRequest whitelist must contain, character for character.
      PRODUCT_BASE_URL: http://127.0.0.1:3000

      # Uncomment, or pass with `-e`, to attach a VNC viewer to display :100.
      # MT5_VNC: "1"
    volumes:
      # The prepared MetaTrader installation. Survives rebuilds — it holds the
      # encrypted WebRequest whitelist, which cannot be recreated from source.
      - mt5template:/opt/mt5
      # One directory per terminal: config, data, logs, its own Wine prefix.
      - mt5instances:/opt/goldgrid/instances
      # Source mounted for development, so an edit does not need a rebuild.
      - .:/rails
      - bundle:/usr/local/bundle
    ports:
      - "3000:3000"
      - "5901:5901"

volumes:
  pgdata:
  mt5template:
  mt5instances:
  bundle:
